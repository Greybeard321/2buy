[package]
name = "two_buy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "2buy"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
base64 = "0.22"

[dev-dependencies]
ureq = { version = "2", features = ["json"] }
